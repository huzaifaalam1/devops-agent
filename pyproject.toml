[project]
name = "devops-agent"
version = "0.1.0"
description = "A local DevOps assistant for repository analysis and Docker development setup"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
    "rich",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "requests (>=2.34.2,<3.0.0)"
]

[project.scripts]
devops-agent = "agent.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]
