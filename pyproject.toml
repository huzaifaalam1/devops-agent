[project]
name = "devops-agent"
version = "0.1.0"
description = "A local DevOps assistant for repository analysis and Docker development setup"
requires-python = ">=3.10"
dependencies = [
    "typer[all]",
    "rich",
    "requests (>=2.34.2,<3.0.0)"
]

[project.scripts]
devops-agent = "agent.main:app"
